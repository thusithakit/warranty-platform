spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8081/realms/warranty-platform}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://keycloak:8080/realms/warranty-platform/protocol/openid-connect/certs}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: purchase-service
              uri: ${PURCHASE_SERVICE_URL:http://purchase-service:4003}
              predicates:
                - Path=/api/v1/purchases,/api/v1/purchases/**

            - id: warranty-service
              uri: ${WARRANTY_SERVICE_URL:http://warranty-service:4004}
              predicates:
                - Path=/api/v1/warranties,/api/v1/warranties/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:4006}
              predicates:
                - Path=/api/v1/notifications,/api/v1/notifications/**

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
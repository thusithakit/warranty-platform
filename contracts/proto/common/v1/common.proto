syntax = "proto3";

package warranty.common.v1;

option java_multiple_files = true;
option java_package = "com.warranty.contracts.common.v1";

message RequestContext {
  string correlation_id = 1;
  string actor_user_id = 2;
  string actor_service = 3;
}

message Empty {}

message ErrorDetail {
  string code = 1;
  string message = 2;
  string correlation_id = 3;
}
